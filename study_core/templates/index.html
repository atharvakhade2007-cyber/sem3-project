{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMind AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'react_build/assets/index.css' %}">
</head>
<body>
    <div id="root"></div>
    <script>
      // Apply the saved theme before first paint so there is no flash of the
      // wrong colour scheme. Light is the default when nothing is stored.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          document.documentElement.setAttribute(
            'data-theme', stored === 'dark' ? 'dark' : 'light'
          );
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <script type="module" src="{% static 'react_build/assets/index.js' %}"></script>
</body>
</html>
