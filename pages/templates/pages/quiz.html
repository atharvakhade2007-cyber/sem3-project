{% load static %}
<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csrf-token" content="{% csrf_token %}">
  <title>Adaptive Quiz — Play</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Small custom styles for flame and feedback animations */
    .flame {
      width: 28px; height: 28px; display:inline-block;
      background: radial-gradient(circle at 30% 30%, #fff3, #ffb86b 30%, transparent 60%);
      border-radius: 50% 50% 40% 40%;
      transform-origin: center bottom;
      transition: transform .2s ease, filter .2s ease;
    }
    .flame--big { transform: scale(1.4); filter: drop-shadow(0 6px 10px rgba(255,120,0,.25)); }
    .option-feedback-correct { animation: optionCorrect .9s ease forwards; }
    .option-feedback-wrong { animation: optionWrong .9s ease forwards; }
    @keyframes optionCorrect { 0% { box-shadow:0 0 0 rgba(34,197,94,0.0)} 50% { box-shadow:0 0 18px rgba(34,197,94,0.65)} 100% { box-shadow:0 0 0 rgba(34,197,94,0.0)} }
    @keyframes optionWrong { 0% { box-shadow:0 0 0 rgba(239,68,68,0.0)} 50% { box-shadow:0 0 18px rgba(239,68,68,0.65)} 100% { box-shadow:0 0 0 rgba(239,68,68,0.0)} }
    .elo-popup { transition: transform .45s cubic-bezier(.2,.9,.2,1), opacity .45s; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">
  <div class="max-w-5xl mx-auto p-6">
    <!-- Header / Stats -->
    <header class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-4">
        <img id="avatar" src="/static/default-avatar.png" alt="avatar" class="w-12 h-12 rounded-full border-2 border-gray-700" />
        <div>
          <div class="flex items-center gap-3">
            <h1 id="username" class="text-xl font-semibold">Learner</h1>
            <div id="elo-badge" class="px-3 py-1 rounded-full bg-gray-800 text-sm">1250 — Scholar</div>
          </div>
          <div class="text-sm text-gray-400">Total XP: <span id="total-xp">0</span> • Questions: <span id="total-questions">0</span></div>
        </div>
      </div>
      <div class="flex items-center gap-6">
        <div class="flex items-center gap-2">
          <div id="streak-flame" class="flame" title="Current streak"></div>
          <div class="text-sm">Streak: <span id="streak">0</span></div>
        </div>
        <button id="uploadOpen" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded">Upload PDF</button>
      </div>
    </header>

    <!-- XP Progress -->
    <div class="mb-6">
      <div class="text-sm text-gray-400 mb-2">XP Progress</div>
      <div class="w-full bg-gray-800 rounded h-4 overflow-hidden">
        <div id="xp-bar" class="h-4 bg-amber-500 w-20%" style="width:0%"></div>
      </div>
    </div>

    <!-- Quiz Play Zone -->
    <main>
      <div id="game-area" class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <section class="col-span-2">
          <div id="question-card" class="bg-gray-800 p-6 rounded-lg shadow-lg">
            <div class="flex justify-between items-start">
              <div class="text-sm text-gray-400">Question</div>
              <div id="question-xp" class="text-sm text-amber-400">XP: 0</div>
            </div>
            <h2 id="question-text" class="mt-4 text-lg leading-relaxed">Loading question…</h2>
            <div id="options" class="mt-6 grid gap-3">
              <!-- Options inserted by JS -->
            </div>
            <div class="mt-4 flex items-center justify-between">
              <div id="feedback" class="text-sm"></div>
              <div class="flex items-center gap-3">
                <button id="nextBtn" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded disabled:opacity-50" disabled>Next Question</button>
              </div>
            </div>
          </div>
        </section>

        <!-- Sidebar / Controls -->
        <aside class="col-span-1">
          <div class="bg-gray-800 p-4 rounded-lg space-y-4">
            <div>
              <div class="text-sm text-gray-400">Current Elo</div>
              <div id="current-elo" class="text-2xl font-semibold">1250</div>
            </div>
            <div>
              <div class="text-sm text-gray-400">Session</div>
              <div class="flex gap-3 text-sm text-gray-300">
                <div>Correct: <span id="session-correct">0</span></div>
                <div>Wrong: <span id="session-wrong">0</span></div>
              </div>
            </div>
            <div>
              <div class="text-sm text-gray-400 mb-2">Level</div>
              <div id="level-title" class="text-lg font-medium">Scholar</div>
            </div>
          </div>
        </aside>
      </div>
    </main>

    <!-- PDF Upload Modal -->
    <div id="uploadModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center">
      <div class="bg-gray-900 w-full max-w-2xl p-6 rounded">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-semibold">Upload PDF Study Material</h3>
          <button id="uploadClose" class="text-gray-400">Close</button>
        </div>
        <div class="mt-4">
          <div id="dropArea" class="border-2 border-dashed border-gray-700 rounded h-36 flex items-center justify-center text-gray-400">Drop PDF here or click to browse</div>
          <input id="fileInput" type="file" accept="application/pdf" class="hidden" />
          <div id="uploadStatus" class="mt-4 text-sm text-gray-400"></div>
        </div>
      </div>
    </div>

    <!-- Elo popup -->
    <div id="eloPopup" class="fixed right-6 bottom-8 elo-popup bg-gray-800 text-amber-300 px-4 py-2 rounded-md shadow-lg opacity-0 pointer-events-none">+18 Elo</div>

  </div>

  <script src="{% static 'pages/quiz_app.js' %}"></script>
</body>
</html>
